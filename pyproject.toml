# Tooling configuration only. Packaging stays in setup.py (its build_py stages
# config/ into the wheel; see the docstring there), so this file declares no
# [build-system] and no [project] table - adding either would switch the build
# to PEP 517 and skip that staging.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# `test_lint.py` runs this set over the package, `tools/` and the skill scripts,
# so `ruff check .` locally and the suite in CI agree on what a finding is.
# F is pyflakes; B8 adds the bugbear checks worth having (B008's import-time
# defaults, B007's unused loop variables); SIM115 catches an unclosed file;
# RUF012/RUF013 are mutable class attributes and implicit Optional. Style rules
# are deliberately not selected - the formatter pass is `ruff format`, and line
# length or quote preferences are not findings here (docs/29 S4-6, #360).
select = ["F", "E9", "B", "PLE", "SIM115", "RUF012", "RUF013"]
# B905 wants `strict=` on every `zip()`. Most of these pair two equally long
# sequences where a truncation would be a real bug, but changing the runtime
# semantics is a code change of its own, not part of the lint pass (#360).
ignore = ["B905"]

[tool.mypy]
# The env package is type-checked and `test_types.py` holds it at zero errors. `train/`
# is not covered yet: it has not been annotated to the same standard (issue #148).
files = ["gym_continuousDoubleAuction/envs"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff.format]
# One formatter pass over a tree that had never had one (issue #148). Quotes are left as
# written: switching 18,000 lines to one style would touch every string for no reason a
# reader benefits from. The CLI notebook is JSON and is not formatted.
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["gym_continuousDoubleAuction/test"]
# The integration suite builds real RLlib Algorithms and takes minutes; select
# it explicitly (`pytest gym_continuousDoubleAuction/test/integration`) rather
# than by default. Without the ignore, CI's unit step collected it too and the
# integration step then ran it a second time.
addopts = "-p no:cacheprovider --ignore=gym_continuousDoubleAuction/test/integration"

[tool.coverage.run]
source = ["gym_continuousDoubleAuction"]
omit = [
    "gym_continuousDoubleAuction/test/*",
]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = false
precision = 1
# Measured on the unit suite (`pytest gym_continuousDoubleAuction/test --ignore=.../integration
# --cov`): 86.4% line-and-branch. The floor sits two points under it so an ordinary change
# does not trip it and a real loss of coverage does. The integration suite is not under
# coverage, so the CLI mains and the RLlib-bound modules are the least covered; raise this
# as they are tested (issue #148).
fail_under = 84
# A command-line entry point is run by hand or by CI's smoke step, not by the unit suite.
exclude_also = ["if __name__ == .__main__.:"]
